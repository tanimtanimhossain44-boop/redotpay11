<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RedotPay Inbox</title>
<style>
  :root{--bg:#0b0b0f;--card:#16161d;--line:#26262f;--txt:#f2f2f5;--mut:#8a8a98;--acc:#e5322d;--ok:#22d39b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;padding:16px;max-width:640px;margin:auto}
  h1{font-size:20px;margin:8px 0 4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f0f15;color:var(--txt);margin-bottom:10px}
  button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
  .code{font-size:30px;font-weight:800;letter-spacing:4px;color:var(--ok);font-variant-numeric:tabular-nums}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .meta{color:var(--mut);font-size:12px;margin-top:6px}
  .subj{font-weight:600;margin-top:6px}
  .snip{color:var(--mut);font-size:13px;margin-top:4px}
  .hide{display:none}
  iframe.mailview{width:100%;height:560px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:10px}
</style>
</head>
<body>
<h1>RedotPay Inbox</h1>
<div class="sub" id="status">Password daalo</div>

<div id="setup" class="card">
  <input id="key" type="password" placeholder="Enter password" autocomplete="current-password">
  <button id="save">Open</button>
</div>

<div id="app" class="hide">
  <div style="margin-bottom:12px" class="row">
    <button id="refresh">Refresh</button>
    <button id="reset" class="ghost">Reset</button>
  </div>
  <div id="list"></div>
</div>

<script>
// NAYA Apps Script deploy karne ke baad uska /exec URL yahan paste karo
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby6XKdSRJuNuUNspmSesiCC8vC0fKtB9nsI-taSIe2fftUrGjg9JeEw05vv0P8nwUQl/exec';
const STORE = 'rdp_cfg';
const $ = id => document.getElementById(id);
let timer = null, seen = new Set(), first = true, lastSig = '';

function cfg(){ try { const c = JSON.parse(localStorage.getItem(STORE)||'null'); return c && c.key ? {url: SCRIPT_URL, key: c.key} : null; } catch(e){ return null; } }

function start(){
  const c = cfg();
  if(!c){ $('setup').classList.remove('hide'); $('app').classList.add('hide'); return; }
  $('setup').classList.add('hide'); $('app').classList.remove('hide');
  load(); clearInterval(timer); timer = setInterval(load, 10000);
}

async function load(){
  const c = cfg(); if(!c) return;
  try{
    $('status').textContent = 'Checking...';
    const r = await fetch(c.url + '?key=' + encodeURIComponent(c.key));
    const d = await r.json();
    if(d.error){ localStorage.removeItem(STORE); clearInterval(timer); start(); $('status').textContent = 'Wrong password'; return; }
    const sig = d.items.map(x => x.id).join(',');
    if(sig !== lastSig){ lastSig = sig; render(d.items); }
    $('status').textContent = 'Updated ' + new Date(d.updated).toLocaleTimeString() + ' - auto refresh 10s';
  }catch(e){ $('status').textContent = 'Error: ' + (e && e.message ? e.message : e) + ' | Script Deploy mein "Who has access: Anyone" hai? Authorize kiya?'; }
}

function render(items){
  const list = $('list'); list.textContent = '';
  if(!items.length){ list.textContent = 'Abhi koi RedotPay mail nahi'; return; }
  items.forEach(m => {
    if(!first && !seen.has(m.id) && m.codes.length && 'vibrate' in navigator) navigator.vibrate(200);
    seen.add(m.id);
    const card = document.createElement('div'); card.className = 'card';
    if(m.codes.length){
      const row = document.createElement('div'); row.className = 'row';
      const code = document.createElement('div'); code.className = 'code'; code.textContent = m.codes[0];
      const b = document.createElement('button'); b.textContent = 'Copy';
      b.onclick = () => { navigator.clipboard.writeText(m.codes[0]); b.textContent = 'Copied'; setTimeout(()=>b.textContent='Copy',1200); };
      row.append(code, b); card.append(row);
    }
    const s = document.createElement('div'); s.className = 'subj'; s.textContent = m.subject;
    const sn = document.createElement('div'); sn.className = 'snip'; sn.textContent = m.snippet;
    const mt = document.createElement('div'); mt.className = 'meta';
    mt.textContent = new Date(m.date).toLocaleString() + ' - ' + m.from;
    card.append(s, sn, mt);
    const vb = document.createElement('button'); vb.className = 'ghost'; vb.style.marginTop = '10px'; vb.textContent = 'View full mail';
    let frame = null;
    vb.onclick = async () => {
      if(frame){ frame.remove(); frame = null; vb.textContent = 'View full mail'; return; }
      vb.textContent = 'Loading...';
      try{
        const c = cfg();
        const r = await fetch(c.url + '?key=' + encodeURIComponent(c.key) + '&id=' + encodeURIComponent(m.id));
        const d = await r.json();
        if(d.error){ vb.textContent = 'Error: ' + d.error; return; }
        if(typeof d.html !== 'string'){ vb.textContent = 'Script purana hai: naya Code.gs deploy karo (New version)'; return; }
        frame = document.createElement('iframe'); frame.className = 'mailview';
        frame.setAttribute('sandbox', 'allow-popups allow-popups-to-escape-sandbox');
        frame.setAttribute('referrerpolicy', 'no-referrer');
        frame.srcdoc = '<base target="_blank">' + d.html;
        card.append(frame); vb.textContent = 'Hide mail';
      }catch(e){ vb.textContent = 'Error: ' + (e.message || e); }
    };
    card.append(vb); list.append(card);
  });
  first = false;
}

$('save').onclick = () => {
  const key = $('key').value.trim();
  if(!key) return;
  localStorage.setItem(STORE, JSON.stringify({url: SCRIPT_URL, key})); $('key').value = ''; start();
};
$('refresh').onclick = load;
$('reset').onclick = () => { localStorage.removeItem(STORE); start(); };
start();
</script>
</body>
</html>
